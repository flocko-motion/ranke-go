name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No build assets: consumers take the library with `go get`, and the
      # cross-implementation artifacts live with the spec in ranke-graph.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
