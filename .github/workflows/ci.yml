name: CI

# The test gate the Makefile's `release` target assumes exists. Every push and
# every PR, so a tag is only ever cut from a tested main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Every row against live services is minutes, not seconds; a hung service or a
    # deadlocked test must still not sit on a runner for the default six hours.
    timeout-minutes: 45

    # Every service the backend matrix knows, addressed here, so every row runs.
    # CLAUDE.md's rule — missing infrastructure is a test failure, not a skip — is
    # only true of a run that can reach all three; a break in any of these values
    # turns the affected rows red.
    env:
      RANKE_NEO4J_BOLT: bolt://127.0.0.1:7687
      RANKE_NEO4J_HTTP: http://127.0.0.1:7474
      RANKE_NEO4J_USER: neo4j
      RANKE_NEO4J_PASS: rankeperfpass
      RANKE_REDIS_ADDR: 127.0.0.1:6379
      RANKE_REDIS_PASS: rankeperfpass
      RANKE_S3_ENDPOINT: http://127.0.0.1:9000
      RANKE_S3_KEY: minioadmin
      RANKE_S3_SECRET: minioadmin

    steps:
      - uses: actions/checkout@v4

      # go.mod is the single source of truth for the toolchain.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # `docker run`, not a services: block: redis needs --requirepass and minio
      # needs `server /data`, and a service container cannot carry a command.
      # Started before the build so the slow one (neo4j) boots while Go compiles.
      - name: Start backends
        run: |
          docker run -d --name ranke-neo4j -p 7474:7474 -p 7687:7687 \
            -e NEO4J_AUTH=neo4j/rankeperfpass docker.io/library/neo4j:5
          docker run -d --name ranke-redis -p 6379:6379 \
            docker.io/library/redis:7-alpine redis-server --requirepass rankeperfpass
          docker run -d --name ranke-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            docker.io/minio/minio:latest server /data

      # The spec the rule-citation gate reads (`RANKE_SPEC`, else docs/papers/) lives
      # in ranke-graph, so it is infrastructure like the services: fetched, not
      # skipped. `make verify` fails without it rather than passing blind.
      - name: Fetch the spec
        run: make docs

      # The static gates a runner can run. NOT `make verify`: that includes `make
      # lint`, which is brokkr — a developer's tool, absent here.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: make fmt-check

      # Every rule id the code cites is one the spec declares. Needs the spec above.
      - name: Rule citations
        run: make rule-citations

      # Neo4j takes tens of seconds to serve, so wait for the wire rather than the
      # container state: a slow boot must not read as a broken backend.
      - name: Wait for backends
        run: |
          serving() {
            curl -sf -o /dev/null http://127.0.0.1:7474/ &&
            curl -sf -o /dev/null http://127.0.0.1:9000/minio/health/ready &&
            (exec 3<>/dev/tcp/127.0.0.1/6379)
          }
          for _ in $(seq 60); do
            if serving; then echo "neo4j, minio and redis are serving"; exit 0; fi
            sleep 5
          done
          echo "backends did not come up within 300s" >&2
          docker ps -a
          exit 1

      # The full gate, the same target a developer runs locally, so the two cannot
      # drift apart: every backend row required, the benchmark, the scale set, and the
      # scenario bundles with their docs. Packages run in parallel —
      # internal/exclusive holds a cross-process lock around the shared neo4j, which
      # is what -p 1 was for.
      - name: Test
        run: make check/full

      # A backend row failing reads as a conformance bug, and the service's own log is
      # what separates that from a service that died under the run.
      - name: Backend logs
        if: failure()
        run: |
          for c in ranke-neo4j ranke-redis ranke-minio; do
            echo "--- $c ---"
            docker logs --tail 50 "$c" 2>&1 || true
          done
